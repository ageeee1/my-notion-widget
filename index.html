<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dopamine Leveling System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(139, 92, 246, 0.3); }
            50% { box-shadow: 0 0 30px rgba(139, 92, 246, 0.6); }
        }
        .glow-card { animation: pulse-glow 4s infinite; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans selection:bg-purple-500 selection:text-white">

    <!-- Верхняя панель / Статус -->
    <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-50 shadow-lg">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-purple-600 p-3 rounded-xl text-white shadow-lg shadow-purple-900/50">
                    <i class="fa-solid fa-brain text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500">DOPAMINE LAB</h1>
                    <p id="sync-status" class="text-xs text-yellow-400 flex items-center gap-1">
                        <i class="fa-solid fa-sync fa-spin"></i> Подключение к JSONBin...
                    </p>
                </div>
            </div>

            <!-- Уровень и XP -->
            <div class="flex items-center gap-6 bg-gray-950/80 px-6 py-3 rounded-2xl border border-gray-800">
                <div class="text-center">
                    <span class="text-xs uppercase text-gray-400 block tracking-widest">Уровень</span>
                    <span id="level-display" class="text-2xl font-black text-purple-400">1</span>
                </div>
                <div class="h-8 w-px bg-gray-800"></div>
                <div class="w-48 sm:w-64">
                    <div class="flex justify-between text-xs mb-1">
                        <span class="text-gray-400">Прогресс XP</span>
                        <span id="xp-text" class="font-bold text-gray-200">0 / 100</span>
                    </div>
                    <div class="w-full bg-gray-800 rounded-full h-3 overflow-hidden p-0.5">
                        <div id="xp-bar" class="bg-gradient-to-r from-purple-500 to-pink-500 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">

        <!-- Левая колонка: Действия (XP) -->
        <div class="lg:col-span-2 space-y-8">
            
            <!-- Позитивные привычки (Плюс XP) -->
            <section class="bg-gray-900/60 border border-gray-800 rounded-2xl p-6 glow-card">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-bold flex items-center gap-2 text-emerald-400">
                        <i class="fa-solid fa-circle-plus"></i> Позитивные действия (Дофамин+)
                    </h2>
                    <button onclick="openModal('positive')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-3 py-2 rounded-lg transition">
                        <i class="fa-solid fa-plus mr-1"></i> Добавить
                    </button>
                </div>
                <div id="positive-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <!-- Рендерится через JS -->
                </div>
            </section>

            <!-- Негативные привычки (Минус XP) -->
            <section class="bg-gray-900/60 border border-gray-800 rounded-2xl p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-bold flex items-center gap-2 text-rose-400">
                        <i class="fa-solid fa-circle-minus"></i> Триггеры / Срывы (Дофамин-)
                    </h2>
                    <button onclick="openModal('negative')" class="bg-rose-600 hover:bg-rose-500 text-white text-xs font-semibold px-3 py-2 rounded-lg transition">
                        <i class="fa-solid fa-plus mr-1"></i> Добавить
                    </button>
                </div>
                <div id="negative-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <!-- Рендерится через JS -->
                </div>
            </section>

        </div>

        <!-- Правая колонка: Трекер Стриков (Streaks) -->
        <div class="space-y-8">
            <section class="bg-gray-900/60 border border-gray-800 rounded-2xl p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-bold flex items-center gap-2 text-amber-400">
                        <i class="fa-solid fa-fire"></i> Трекер Стриков
                    </h2>
                    <button onclick="openModal('streak')" class="bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold px-3 py-2 rounded-lg transition">
                        <i class="fa-solid fa-plus mr-1"></i> Задача
                    </button>
                </div>
                <div id="streaks-list" class="space-y-4">
                    <!-- Рендерится через JS -->
                </div>
            </section>
        </div>

    </main>

    <!-- Модальное окно добавления -->
    <div id="action-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
            <h3 id="modal-title" class="text-lg font-bold text-white">Добавить элемент</h3>
            <div>
                <label class="block text-xs text-gray-400 mb-1">Название</label>
                <input type="text" id="modal-name" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-purple-500" placeholder="Например: Тренировка / Воздержание">
            </div>
            <div id="modal-xp-container">
                <label class="block text-xs text-gray-400 mb-1" id="modal-xp-label">Количество XP</label>
                <input type="number" id="modal-xp" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-purple-500" value="50">
            </div>
            <div class="flex justify-end gap-3 pt-2">
                <button onclick="closeModal()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-4 py-2 rounded-xl text-sm transition">Отмена</button>
                <button onclick="saveNewAction()" class="bg-purple-600 hover:bg-purple-500 text-white px-5 py-2 rounded-xl text-sm font-semibold transition">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Логика скрипта -->
    <script>
        const BIN_ID = "6ae4d805ac6210605a5f66f0";
        const API_KEY = "$2a$10$zO6OXGmcu2KvGcO3IaTkRODmKt2zrnA/F9oJaKG3K2Te28jjW81yu";

        let state = {
            xp: 0,
            level: 1,
            positiveActions: [
                { id: 'p1', name: 'Спорт / Тренировка', xp: 40 },
                { id: 'p2', name: 'Холодный душ', xp: 25 },
                { id: 'p3', name: 'Чтение книги (30 мин)', xp: 20 },
                { id: 'p4', name: 'Продуктивная работа', xp: 30 }
            ],
            negativeActions: [
                { id: 'n1', name: 'Просмотр порно', xp: -80 },
                { id: 'n2', name: 'Залипание в Reels / TikTok', xp: -40 },
                { id: 'n3', name: 'Фастфуд / Сахар', xp: -25 }
            ],
            streaks: [
                { id: 's1', name: 'Воздержание от порно', streak: 0, lastDate: null },
                { id: 's2', name: 'Без социальных сетей', streak: 0, lastDate: null }
            ]
        };

        let currentModalType = 'positive';

        // Загрузка данных с JSONBin.io при старте
        async function loadData() {
            const statusEl = document.getElementById('sync-status');
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                if (!response.ok) throw new Error('Ошибка сети');
                const data = await response.json();
                if (data.record) {
                    state = data.record;
                    if(!state.positiveActions) state.positiveActions = [];
                    if(!state.negativeActions) state.negativeActions = [];
                    if(!state.streaks) state.streaks = [];
                }
                render();
                statusEl.innerHTML = '<i class="fa-solid fa-cloud-arrow-down text-green-400"></i> Данные синхронизированы';
                statusEl.className = 'text-xs text-green-400 flex items-center gap-1';
            } catch (error) {
                console.error(error);
                render();
                statusEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-red-400"></i> Ошибка синхронизации';
                statusEl.className = 'text-xs text-red-400 flex items-center gap-1';
            }
        }

        // Сохранение данных на JSONBin.io
        async function saveData() {
            const statusEl = document.getElementById('sync-status');
            statusEl.innerHTML = '<i class="fa-solid fa-sync fa-spin text-yellow-400"></i> Сохранение...';
            statusEl.className = 'text-xs text-yellow-400 flex items-center gap-1';

            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify(state)
                });
                if (!response.ok) throw new Error('Ошибка сохранения');
                statusEl.innerHTML = '<i class="fa-solid fa-check text-green-400"></i> Сохранено в JSONBin';
                statusEl.className = 'text-xs text-green-400 flex items-center gap-1';
            } catch (error) {
                console.error(error);
                statusEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-red-400"></i> Ошибка сохранения';
                statusEl.className = 'text-xs text-red-400 flex items-center gap-1';
            }
        }

        // Изменение XP
        function addXP(amount) {
            state.xp += amount;
            if (state.xp < 0) state.xp = 0;

            // Расчет уровней (каждые 100 XP = 1 уровень)
            state.level = Math.floor(state.xp / 100) + 1;

            render();
            saveData();
        }

        // Чек-ин по стрику (Streak)
        function checkStreak(id) {
            const today = new Date().toISOString().split('T')[0];
            const streakObj = state.streaks.find(s => s.id === id);
            if (!streakObj) return;

            if (streakObj.lastDate === today) {
                alert('Вы уже отмечались по этой задаче сегодня!');
                return;
            }

            if (streakObj.lastDate) {
                const last = new Date(streakObj.lastDate);
                const now = new Date(today);
                const diffTime = Math.abs(now - last);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                if (diffDays === 1) {
                    streakObj.streak += 1;
                } else if (diffDays > 1) {
                    streakObj.streak = 1; // Сброс стрика при пропуске больше 1 дня
                }
            } else {
                streakObj.streak = 1;
            }

            streakObj.lastDate = today;
            addXP(15); // Бонус XP за чекин стрика
            render();
            saveData();
        }

        // Сброс стрика при срыве
        function resetStreak(id) {
            if (!confirm('Вы уверены, что произошел срыв? Стрик обнулится.')) return;
            const streakObj = state.streaks.find(s => s.id === id);
            if (streakObj) {
                streakObj.streak = 0;
                streakObj.lastDate = null;
                addXP(-50); // Штраф XP за срыв
                render();
                saveData();
            }
        }

        // Модальное окно
        function openModal(type) {
            currentModalType = type;
            const modal = document.getElementById('action-modal');
            const title = document.getElementById('modal-title');
            const xpContainer = document.getElementById('modal-xp-container');
            
            document.getElementById('modal-name').value = '';
            
            if (type === 'streak') {
                title.innerText = 'Добавить задачу для стрика';
                xpContainer.style.display = 'none';
            } else {
                title.innerText = type === 'positive' ? 'Добавить позитивное действие' : 'Добавить триггер/срыв';
                xpContainer.style.display = 'block';
                document.getElementById('modal-xp-label').innerText = type === 'positive' ? 'Прирост XP (+)' : 'Штраф XP (-)';
                document.getElementById('modal-xp').value = type === 'positive' ? '30' : '-50';
            }
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('action-modal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        function saveNewAction() {
            const name = document.getElementById('modal-name').value.trim();
            if (!name) return alert('Введите название!');

            const newId = 'id_' + Math.random().toString(36).substr(2, 9);

            if (currentModalType === 'streak') {
                state.streaks.push({ id: newId, name, streak: 0, lastDate: null });
            } else {
                let xp = parseInt(document.getElementById('modal-xp').value) || 10;
                if (currentModalType === 'negative' && xp > 0) xp = -Math.abs(xp);
                if (currentModalType === 'positive' && xp < 0) xp = Math.abs(xp);

                if (currentModalType === 'positive') {
                    state.positiveActions.push({ id: newId, name, xp });
                } else {
                    state.negativeActions.push({ id: newId, name, xp });
                }
            }

            closeModal();
            render();
            saveData();
        }

        function deleteItem(type, id) {
            if(!confirm('Удалить этот элемент?')) return;
            if (type === 'positive') state.positiveActions = state.positiveActions.filter(i => i.id !== id);
            if (type === 'negative') state.negativeActions = state.negativeActions.filter(i => i.id !== id);
            if (type === 'streak') state.streaks = state.streaks.filter(i => i.id !== id);
            render();
            saveData();
        }

        // Рендеринг интерфейса
        function render() {
            // Уровень и XP
            document.getElementById('level-display').innerText = state.level;
            const currentXPInLevel = state.xp % 100;
            document.getElementById('xp-text').innerText = `${currentXPInLevel} / 100 XP (Всего: ${state.xp})`;
            document.getElementById('xp-bar').style.width = `${currentXPInLevel}%`;

            // Позитивные привычки
            const posList = document.getElementById('positive-list');
            posList.innerHTML = state.positiveActions.map(item => `
                <div class="bg-gray-950/60 border border-gray-800/80 p-4 rounded-xl flex justify-between items-center group hover:border-emerald-500/50 transition">
                    <div>
                        <h4 class="font-semibold text-sm text-gray-200">${item.name}</h4>
                        <span class="text-xs text-emerald-400 font-bold">+${item.xp} XP</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="addXP(${item.xp})" class="bg-emerald-600/20 hover:bg-emerald-600 text-emerald-400 hover:text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">Выполнить</button>
                        <button onclick="deleteItem('positive', '${item.id}')" class="text-gray-600 hover:text-rose-400 opacity-0 group-hover:opacity-100 transition px-1"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');

            // Негативные привычки
            const negList = document.getElementById('negative-list');
            negList.innerHTML = state.negativeActions.map(item => `
                <div class="bg-gray-950/60 border border-gray-800/80 p-4 rounded-xl flex justify-between items-center group hover:border-rose-500/50 transition">
                    <div>
                        <h4 class="font-semibold text-sm text-gray-200">${item.name}</h4>
                        <span class="text-xs text-rose-400 font-bold">${item.xp} XP</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="addXP(${item.xp})" class="bg-rose-600/20 hover:bg-rose-600 text-rose-400 hover:text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">Сорвался</button>
                        <button onclick="deleteItem('negative', '${item.id}')" class="text-gray-600 hover:text-rose-400 opacity-0 group-hover:opacity-100 transition px-1"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');

            // Стрики
            const streaksList = document.getElementById('streaks-list');
            const today = new Date().toISOString().split('T')[0];
            streaksList.innerHTML = state.streaks.map(item => {
                const checkedToday = item.lastDate === today;
                return `
                    <div class="bg-gray-950/60 border border-gray-800/80 p-4 rounded-xl space-y-3 group hover:border-amber-500/50 transition">
                        <div class="flex justify-between items-start">
                            <div>
                                <h4 class="font-semibold text-sm text-gray-200">${item.name}</h4>
                                <p class="text-xs text-amber-400 font-bold mt-0.5"><i class="fa-solid fa-fire mr-1"></i> Стрик: ${item.streak} дней</p>
                            </div>
                            <button onclick="deleteItem('streak', '${item.id}')" class="text-gray-600 hover:text-rose-400 opacity-0 group-hover:opacity-100 transition"><i class="fa-solid fa-trash"></i></button>
                        </div>
                        <div class="flex gap-2 pt-1">
                            <button onclick="checkStreak('${item.id}')" ${checkedToday ? 'disabled' : ''} class="flex-1 ${checkedToday ? 'bg-gray-800 text-gray-500 cursor-not-allowed' : 'bg-amber-600/20 hover:bg-amber-600 text-amber-400 hover:text-white'} py-2 rounded-lg text-xs font-bold transition">
                                ${checkedToday ? '✓ Отмечено за сегодня' : 'Отметиться день (+XP)'}
                            </button>
                            <button onclick="resetStreak('${item.id}')" class="bg-rose-950/40 hover:bg-rose-600 text-rose-400 hover:text-white px-3 py-2 rounded-lg text-xs font-bold transition" title="Сорвался / Сбросить стрик">
                                <i class="fa-solid fa-rotate-right"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Запуск при загрузке страницы
        loadData();
    </script>
</body>
</html>
