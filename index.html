<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft RPG Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'VT323', monospace;
      background-color: #1a1a1a;
      color: #373737;
      user-select: none;
      image-rendering: pixelated;
    }

    /* Главное окно контейнера GUI Minecraft */
    .mc-gui-panel {
      background-color: #c6c6c6;
      border-top: 4px solid #ffffff;
      border-left: 4px solid #ffffff;
      border-right: 4px solid #555555;
      border-bottom: 4px solid #555555;
      box-shadow: 0 0 0 4px #000000;
    }

    /* Стиль ячеек/слотов инвентаря */
    .mc-slot {
      background-color: #8b8b8b;
      border-top: 3px solid #373737;
      border-left: 3px solid #373737;
      border-right: 3px solid #ffffff;
      border-bottom: 3px solid #ffffff;
    }

    /* Классическая кнопка Minecraft */
    .mc-button {
      background-color: #999999;
      border-top: 3px solid #ffffff;
      border-left: 3px solid #ffffff;
      border-right: 3px solid #373737;
      border-bottom: 3px solid #373737;
      color: #e0e0e0;
      text-shadow: 2px 2px 0px #3f3f3f;
    }
    .mc-button:hover {
      background-color: #a8a8a8;
      border-color: #ffffff #2a2a2a #2a2a2a #ffffff;
      color: #ffffa0;
    }
    .mc-button:active {
      border-top: 3px solid #373737;
      border-left: 3px solid #373737;
      border-right: 3px solid #ffffff;
      border-bottom: 3px solid #ffffff;
    }

    /* Кнопка срыва (Danger Button) */
    .mc-button-danger {
      background-color: #a83232;
      border-top: 3px solid #ff6b6b;
      border-left: 3px solid #ff6b6b;
      border-right: 3px solid #4a1111;
      border-bottom: 3px solid #4a1111;
      color: #ffffff;
      text-shadow: 2px 2px 0px #200000;
    }
    .mc-button-danger:hover {
      background-color: #c43d3d;
    }

    /* Текст в стиле Minecraft (с тенью) */
    .mc-text {
      text-shadow: 2px 2px 0px #202020;
    }
    .mc-text-dark {
      text-shadow: 2px 2px 0px #a0a0a0;
    }

    /* Индикатор опыта (XP Bar Minecraft) */
    .mc-xp-bg {
      background-color: #112200;
      border: 2px solid #000000;
    }
    .mc-xp-fill {
      background-color: #80ff20;
      box-shadow: inset 0 2px 0 #c0ff60, inset 0 -2px 0 #40a000;
    }
  </style>
</head>
<body class="p-4 min-h-screen flex items-center justify-center">

  <!-- GUI ПАНЕЛЬ -->
  <div class="mc-gui-panel w-full max-w-md p-4 relative">
    
    <!-- Шапка персонажа и стрик -->
    <div class="flex items-center justify-between mb-3 border-b-2 border-[#555] pb-2">
      <div class="flex items-center gap-3">
        <!-- Слот с книги или аватаркой -->
        <div class="mc-slot w-12 h-12 flex items-center justify-center text-2xl">
          📖
        </div>
        <div>
          <div class="text-xl font-bold text-[#1f1f1f]">ИНВЕНТАРЬ ПЕРСОНАЖА</div>
          <div class="text-lg text-[#373737]">Уровень: <span id="player-level" class="text-[#00aa00] font-bold text-xl">1</span></div>
        </div>
      </div>

      <div class="text-right">
        <div class="text-xs text-[#555] flex items-center justify-end gap-1 font-bold">
          <span>СИНХРОНИЗАЦИЯ</span>
          <span id="sync-status" class="w-2.5 h-2.5 rounded-full bg-yellow-500 border border-black"></span>
        </div>
        <div class="text-lg font-bold text-[#111]">СТРИК: <span id="streak-days" class="text-[#00aa00]">0</span> ДН</div>
      </div>
    </div>

    <!-- Дебафф баннер -->
    <div id="debuff-banner" class="hidden mb-3 p-2 bg-[#550000] border-2 border-[#ff0000] text-center text-white">
      <span class="text-sm font-bold mc-text text-[#ff5555] block">⚠️ ДЕБАФФ: ВЫГОРАНИЕ РЕЦЕПТОРОВ</span>
      <span class="text-xs text-[#ffaaaa]">Штраф: −50% к получаемому XP</span>
    </div>

    <!-- Полоса опыта XP -->
    <div class="mb-4">
      <div class="flex justify-between text-base font-bold text-[#222] mb-0.5">
        <span>Опыт (XP)</span>
        <span><span id="current-xp">0</span> / <span id="max-xp">100</span></span>
      </div>
      <div class="mc-xp-bg h-4 w-full p-0.5">
        <div id="xp-bar" class="mc-xp-fill h-full transition-all duration-200" style="width: 0%"></div>
      </div>
    </div>

    <!-- Быстрый Контратак (Макросы) -->
    <div class="mb-4">
      <div class="text-base font-bold text-[#222] mb-1 uppercase">⚡ Быстрый Контратак</div>
      <div class="grid grid-cols-2 gap-2">
        <button onclick="triggerMacro('physical')" class="mc-button p-2 text-left">
          <div class="text-sm font-bold mc-text text-[#55ff55]">💪 Физика (+20 XP)</div>
          <div class="text-xs text-[#ddd]">20 отжиманий / вода</div>
        </button>
        <button onclick="triggerMacro('mental')" class="mc-button p-2 text-left">
          <div class="text-sm font-bold mc-text text-[#55ffff]">🧠 Фокус (+20 XP)</div>
          <div class="text-xs text-[#ddd]">Перехват ЦНС / Чтение</div>
        </button>
      </div>
    </div>

    <!-- Квесты Созидания -->
    <div class="mb-4">
      <div class="text-base font-bold text-[#222] mb-1 uppercase">🎯 Квесты Созидания</div>
      <div class="space-y-1.5">
        <label class="mc-slot flex items-center justify-between p-2 cursor-pointer hover:bg-[#999]">
          <span class="text-base text-[#fff] mc-text">🏋️‍♂️ Силовая / Кардио</span>
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-[#ffff55] mc-text">+50 XP</span>
            <input type="checkbox" onchange="toggleQuest(this, 50)" class="w-4 h-4 accent-[#55ff55]">
          </div>
        </label>
        <label class="mc-slot flex items-center justify-between p-2 cursor-pointer hover:bg-[#999]">
          <span class="text-base text-[#fff] mc-text">🧘‍♂️ 1 час работы в тишине</span>
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-[#ffff55] mc-text">+40 XP</span>
            <input type="checkbox" onchange="toggleQuest(this, 40)" class="w-4 h-4 accent-[#55ff55]">
          </div>
        </label>
        <label class="mc-slot flex items-center justify-between p-2 cursor-pointer hover:bg-[#999]">
          <span class="text-base text-[#fff] mc-text">📖 Чтение книг (30 мин)</span>
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-[#ffff55] mc-text">+30 XP</span>
            <input type="checkbox" onchange="toggleQuest(this, 30)" class="w-4 h-4 accent-[#55ff55]">
          </div>
        </label>
      </div>
    </div>

    <!-- Нижняя панель действий -->
    <div class="pt-2 border-t-2 border-[#555] flex justify-between items-center gap-2">
      <button onclick="addCleanDay()" class="mc-button text-sm px-3 py-2 flex-1">
        ✅ Чистый день (+1)
      </button>
      <button onclick="triggerRelapse()" class="mc-button-danger text-sm px-3 py-2 flex-1">
        ⚠️ Срыв
      </button>
    </div>

  </div>

  <script>
    // JSONBin.io Настройки
    const BIN_ID = "6ae4d805ac6210605a5f66f0"; 
    const API_KEY = "$2a$10$zO6OXGmcu2KvGcO3IaTkRODmKt2zrnA/F9oJaKG3K2Te28jjW81yu";

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(freq, type, duration) {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    let gameState = {
      level: 1,
      xp: 0,
      maxXp: 100,
      streak: 0,
      hasDebuff: false,
      debuffEndTime: 0
    };

    async function loadStateFromCloud() {
      if (BIN_ID === "ВАШ_BIN_ID_ЗДЕСЬ") {
        document.getElementById('sync-status').style.backgroundColor = '#ff5555';
        return;
      }
      try {
        const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          headers: { 'X-Master-Key': API_KEY }
        });
        const data = await response.json();
        if (data && data.record) {
          gameState = data.record;
          updateUI();
          document.getElementById('sync-status').style.backgroundColor = '#55ff55';
        }
      } catch(e) {
        document.getElementById('sync-status').style.backgroundColor = '#ff5555';
      }
    }

    async function saveStateToCloud() {
      if (BIN_ID === "ВАШ_BIN_ID_ЗДЕСЬ") return;
      document.getElementById('sync-status').style.backgroundColor = '#ffff55';
      try {
        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': API_KEY
          },
          body: JSON.stringify(gameState)
        });
        document.getElementById('sync-status').style.backgroundColor = '#55ff55';
      } catch(e) {
        document.getElementById('sync-status').style.backgroundColor = '#ff5555';
      }
    }

    function checkDebuff() {
      if (gameState.hasDebuff && Date.now() > gameState.debuffEndTime) {
        gameState.hasDebuff = false;
      }
    }

    function addXP(amount) {
      checkDebuff();
      let finalXP = gameState.hasDebuff ? Math.floor(amount * 0.5) : amount;
      gameState.xp += finalXP;
      
      playSound(800, 'square', 0.1);

      if (gameState.xp >= gameState.maxXp) {
        gameState.xp -= gameState.maxXp;
        gameState.level += 1;
        gameState.maxXp = Math.floor(gameState.maxXp * 1.3);
        playSound(1000, 'triangle', 0.3);
      }
      saveStateToCloud();
      updateUI();
    }

    function triggerMacro(type) {
      addXP(20);
    }

    function toggleQuest(checkbox, xpAmount) {
      if (checkbox.checked) {
        addXP(xpAmount);
      } else {
        gameState.xp = Math.max(0, gameState.xp - xpAmount);
        saveStateToCloud();
        updateUI();
      }
    }

    function addCleanDay() {
      gameState.streak += 1;
      playSound(600, 'sine', 0.15);
      saveStateToCloud();
      updateUI();
    }

    function triggerRelapse() {
      if (confirm("Зафиксировать срыв? Стрик будет сброшен, и активируется дебафф 'Выгорание рецепторов' (-50% XP) на 24 часа.")) {
        gameState.streak = 0;
        gameState.hasDebuff = true;
        gameState.debuffEndTime = Date.now() + (24 * 60 * 60 * 1000);
        playSound(120, 'sawtooth', 0.4);
        saveStateToCloud();
        updateUI();
      }
    }

    function updateUI() {
      checkDebuff();
      document.getElementById('player-level').innerText = gameState.level;
      document.getElementById('streak-days').innerText = gameState.streak;
      document.getElementById('current-xp').innerText = gameState.xp;
      document.getElementById('max-xp').innerText = gameState.maxXp;
      
      const xpPercent = Math.min(100, Math.floor((gameState.xp / gameState.maxXp) * 100));
      document.getElementById('xp-bar').style.width = `${xpPercent}%`;

      const debuffBanner = document.getElementById('debuff-banner');
      if (gameState.hasDebuff) {
        debuffBanner.classList.remove('hidden');
      } else {
        debuffBanner.classList.add('hidden');
      }
    }

    loadStateFromCloud();
  </script>
</body>
</html>
