<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft RPG Dashboard (Exact Pickaxe & Destroy Animation)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'VT323', monospace;
      background-color: #1a1a1a;
      color: #373737;
      user-select: none;
      image-rendering: pixelated;
      overflow-x: hidden;
    }

    /* Главное окно GUI Minecraft */
    .mc-gui-panel {
      background-color: #c6c6c6;
      border-top: 4px solid #ffffff;
      border-left: 4px solid #ffffff;
      border-right: 4px solid #555555;
      border-bottom: 4px solid #555555;
      box-shadow: 0 0 0 4px #000000;
      position: relative;
    }

    /* Ячейки инвентаря */
    .mc-slot {
      background-color: #8b8b8b;
      border-top: 3px solid #373737;
      border-left: 3px solid #373737;
      border-right: 3px solid #ffffff;
      border-bottom: 3px solid #ffffff;
    }

    /* Кнопка Minecraft */
    .mc-button {
      background-color: #999999;
      border-top: 3px solid #ffffff;
      border-left: 3px solid #ffffff;
      border-right: 3px solid #373737;
      border-bottom: 3px solid #373737;
      color: #e0e0e0;
      text-shadow: 2px 2px 0px #3f3f3f;
    }
    .mc-button:hover {
      background-color: #a8a8a8;
      color: #ffffa0;
    }
    .mc-button:active {
      border-top: 3px solid #373737;
      border-left: 3px solid #373737;
      border-right: 3px solid #ffffff;
      border-bottom: 3px solid #ffffff;
    }

    /* Кнопка срыва */
    .mc-button-danger {
      background-color: #a83232;
      border-top: 3px solid #ff6b6b;
      border-left: 3px solid #ff6b6b;
      border-right: 3px solid #4a1111;
      border-bottom: 3px solid #4a1111;
      color: #ffffff;
      text-shadow: 2px 2px 0px #200000;
    }
    .mc-button-danger:hover {
      background-color: #c43d3d;
    }

    /* Оригинальные тексты Minecraft без неонов */
    .mc-text-green {
      color: #55ff55;
      text-shadow: 2px 2px 0px #00aa00;
    }
    .mc-text-gold {
      color: #ffff55;
      text-shadow: 2px 2px 0px #aaaa00;
    }
    .mc-text-aqua {
      color: #55ffff;
      text-shadow: 2px 2px 0px #00aaaa;
    }
    .mc-text-dark {
      color: #1f1f1f;
      text-shadow: 1px 1px 0px #8b8b8b;
    }

    /* Полоса опыта XP */
    .mc-xp-bg {
      background-color: #112200;
      border: 2px solid #000000;
    }
    .mc-xp-fill {
      background-color: #80ff20;
      box-shadow: inset 0 2px 0 #c0ff60, inset 0 -2px 0 #40a000;
    }

    /* АНИМАЦИЯ КИРКИ И РАЗРУШЕНИЯ БЛОКА */
    @keyframes pickaxeMining {
      0% { transform: rotate(0deg) translate(0, 0); }
      30% { transform: rotate(-70deg) translate(-10px, -20px); }
      70% { transform: rotate(15deg) translate(5px, 10px); }
      100% { transform: rotate(0deg) translate(0, 0); }
    }

    @keyframes guiShake {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-4px, 4px); }
      50% { transform: translate(4px, -4px); }
      75% { transform: translate(-4px, -2px); }
      100% { transform: translate(0, 0); }
    }

    @keyframes guiShatter {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05) rotate(2deg); opacity: 0.8; }
      100% { transform: scale(0.2) rotate(-15deg); opacity: 0; }
    }

    .animate-mining {
      animation: pickaxeMining 0.3s ease-in-out infinite;
    }

    .animate-shake {
      animation: guiShake 0.15s ease-in-out infinite;
    }

    .animate-shatter {
      animation: guiShatter 0.4s ease-in forwards;
    }

    /* Оверлей трещин блока (Block Crack Overlay) */
    .destroy-stage {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 40;
      background-size: cover;
      opacity: 0.8;
    }

    .mc-particle {
      position: absolute;
      width: 16px;
      height: 16px;
      background-color: #8b8b8b;
      border: 3px solid #373737;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>
<body class="p-4 min-h-screen flex items-center justify-center relative">

  <!-- АНИМАЦИОННЫЙ СЛОЙ -->
  <div id="animation-overlay" class="fixed inset-0 pointer-events-none z-50 flex items-center justify-center hidden">
    
    <!-- ТРЕЩИНЫ РАЗРУШЕНИЯ БЛОКА (Оверлей) -->
    <svg id="crack-overlay" class="absolute w-full max-w-md h-full z-40 hidden" viewBox="0 0 100 100" preserveAspectRatio="none">
      <path id="crack-path" d="" stroke="#000000" stroke-width="2" fill="none" opacity="0.7"/>
    </svg>

    <!-- ТОЧНАЯ АЛМАЗНАЯ КИРКА ИЗ КАРТИНКИ (Pixel-Art SVG) -->
    <svg id="diamond-pickaxe" class="w-36 h-36 absolute z-50 drop-shadow-[0_8px_0_rgba(0,0,0,0.7)]" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Рукоятка (Коричневый древесный градиент) -->
      <path d="M3 13H4V14H3V13Z" fill="#2D1B00"/>
      <path d="M4 12H5V13H4V12Z" fill="#00D8FF"/>
      <path d="M4 13H5V14H4V13Z" fill="#0080FF"/>
      <path d="M4 11H5V12H4V11Z" fill="#8B4513"/>
      <path d="M5 12H6V13H5V12Z" fill="#5C2E0B"/>
      <path d="M5 10H6V11H5V10Z" fill="#8B4513"/>
      <path d="M6 11H7V12H6V11Z" fill="#5C2E0B"/>
      <path d="M6 9H7V10H6V9Z" fill="#8B4513"/>
      <path d="M7 10H8V11H7V10Z" fill="#5C2E0B"/>
      <path d="M7 8H8V9H7V8Z" fill="#8B4513"/>
      <path d="M8 9H9V10H8V9Z" fill="#5C2E0B"/>
      <path d="M8 7H9V8H8V7Z" fill="#8B4513"/>
      <path d="M9 8H10V9H9V8Z" fill="#5C2E0B"/>
      <!-- Алмазное лезвие (Светло-голубой, синий и ярко-голубой) -->
      <path d="M5 2H9V3H5V2Z" fill="#00A2FF"/>
      <path d="M5 3H8V4H5V3Z" fill="#00F0FF"/>
      <path d="M6 1H9V2H6V1Z" fill="#00A2FF"/>
      <path d="M7 0H10V1H7V0Z" fill="#0080FF"/>
      <path d="M10 1H11V2H10V1Z" fill="#00F0FF"/>
      <path d="M11 2H12V3H11V2Z" fill="#00F0FF"/>
      <path d="M12 3H13V5H12V3Z" fill="#00A2FF"/>
      <path d="M11 4H12V6H11V4Z" fill="#0080FF"/>
      <path d="M10 5H11V7H10V5Z" fill="#003BFF"/>
      <path d="M12 2H13V3H12V2Z" fill="#003BFF"/>
      <path d="M11 3H12V4H11V3Z" fill="#D2F9FF"/>
      <path d="M10 4H11V5H10V4Z" fill="#D2F9FF"/>
      <path d="M9 5H10V7H9V5Z" fill="#00A2FF"/>
      <path d="M9 3H10V5H9V3Z" fill="#8B4513"/>
      <path d="M10 3H11V4H10V3Z" fill="#5C2E0B"/>
      <path d="M8 5H9V7H8V5Z" fill="#00A2FF"/>
      <path d="M7 6H8V8H7V6Z" fill="#0080FF"/>
    </svg>

    <!-- Баннер Achievement Level-Up -->
    <div id="levelup-banner" class="mc-gui-panel p-6 text-center shadow-2xl z-50 hidden">
      <div class="text-2xl font-bold mc-text-gold mb-1">ДОСТИЖЕНИЕ ПОЛУЧЕНО!</div>
      <div class="text-4xl font-bold mc-text-green mb-2">УРОВЕНЬ <span id="banner-level-num">2</span></div>
      <div class="text-base text-[#1f1f1f] font-bold">НОВЫЙ УРОВЕНЬ РЕЦЕПТОРОВ РАЗБЛОКИРОВАН</div>
    </div>
  </div>

  <!-- ОСНОВНАЯ GUI ПАНЕЛЬ -->
  <div id="main-gui" class="mc-gui-panel w-full max-w-md p-4 relative">
    
    <!-- Шапка инвентаря -->
    <div class="flex items-center justify-between mb-3 border-b-2 border-[#555] pb-2">
      <div class="flex items-center gap-3">
        <div class="mc-slot w-12 h-12 flex items-center justify-center text-2xl">
          📘
        </div>
        <div>
          <div class="text-xl font-bold mc-text-dark">ИНВЕНТАРЬ ИГРОКА</div>
          <div class="text-lg text-[#373737] font-bold">Уровень: <span id="player-level" class="mc-text-green text-xl">1</span></div>
        </div>
      </div>

      <div class="text-right">
        <div class="text-xs text-[#555] flex items-center justify-end gap-1 font-bold">
          <span>СИНХРОНИЗАЦИЯ</span>
          <span id="sync-status" class="w-2.5 h-2.5 rounded-full bg-yellow-500 border border-black"></span>
        </div>
        <div class="text-lg font-bold text-[#111]">СТРИК: <span id="streak-days" class="mc-text-green">0</span> ДН</div>
      </div>
    </div>

    <!-- Дебафф баннер -->
    <div id="debuff-banner" class="hidden mb-3 p-2 bg-[#550000] border-2 border-[#ff0000] text-center text-white">
      <span class="text-sm font-bold text-[#ff5555] block">⚠️ ДЕБАФФ: ВЫГОРАНИЕ РЕЦЕПТОРОВ</span>
      <span class="text-xs text-[#ffaaaa]">Штраф: −50% к получаемому XP</span>
    </div>

    <!-- Полоса опыта XP -->
    <div class="mb-4">
      <div class="flex justify-between text-base font-bold text-[#222] mb-0.5">
        <span>Шкала Опыта (XP)</span>
        <span><span id="current-xp">0</span> / <span id="max-xp">100</span> XP</span>
      </div>
      <div class="mc-xp-bg h-4 w-full p-0.5">
        <div id="xp-bar" class="mc-xp-fill h-full transition-all duration-200" style="width: 0%"></div>
      </div>
    </div>

    <!-- Быстрый Контратак -->
    <div class="mb-4">
      <div class="text-base font-bold text-[#222] mb-1 uppercase">⚡ Быстрый Контратак (Переключение)</div>
      <div class="grid grid-cols-2 gap-2">
        <button onclick="triggerMacro('physical')" class="mc-button p-2 text-left">
          <div class="text-sm font-bold mc-text-green">💪 Физика (+20 XP)</div>
          <div class="text-xs text-[#eee]">20 отжиманий / лед</div>
        </button>
        <button onclick="triggerMacro('mental')" class="mc-button p-2 text-left">
          <div class="text-sm font-bold mc-text-aqua">🧠 Фокус (+20 XP)</div>
          <div class="text-xs text-[#eee]">Перехват ЦНС / Книга</div>
        </button>
      </div>
    </div>

    <!-- Квесты Созидания -->
    <div class="mb-4">
      <div class="text-base font-bold text-[#222] mb-1 uppercase">🎯 Квесты Созидания (Прокачка)</div>
      <div class="space-y-1.5">
        <label class="mc-slot flex items-center justify-between p-2 cursor-pointer hover:bg-[#999]">
          <span class="text-base text-[#fff]">🏋️‍♂️ Силовая / Кардио</span>
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold mc-text-gold">+50 XP</span>
            <input type="checkbox" onchange="toggleQuest(this, 50)" class="w-4 h-4 accent-[#55ff55]">
          </div>
        </label>
        <label class="mc-slot flex items-center justify-between p-2 cursor-pointer hover:bg-[#999]">
          <span class="text-base text-[#fff]">🧘‍♂️ 1 час работы в тишине</span>
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold mc-text-gold">+40 XP</span>
            <input type="checkbox" onchange="toggleQuest(this, 40)" class="w-4 h-4 accent-[#55ff55]">
          </div>
        </label>
        <label class="mc-slot flex items-center justify-between p-2 cursor-pointer hover:bg-[#999]">
          <span class="text-base text-[#fff]">📖 Чтение книг (30 мин)</span>
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold mc-text-gold">+30 XP</span>
            <input type="checkbox" onchange="toggleQuest(this, 30)" class="w-4 h-4 accent-[#55ff55]">
          </div>
        </label>
      </div>
    </div>

    <!-- Нижняя панель -->
    <div class="pt-2 border-t-2 border-[#555] flex justify-between items-center gap-2">
      <button onclick="addCleanDay()" class="mc-button text-sm px-3 py-2 flex-1 font-bold">
        ✅ Чистый День (+1 к Стрику)
      </button>
      <button onclick="triggerRelapse()" class="mc-button-danger text-sm px-3 py-2 flex-1 font-bold">
        ⚠️ Зафиксировать Срыв
      </button>
    </div>

  </div>

  <script>
    // JSONBin.io Настройки
    const BIN_ID = "6ae4d805ac6210605a5f66f0"; 
    const API_KEY = "$2a$10$zO6OXGmcu2KvGcO3IaTkRODmKt2zrnA/F9oJaKG3K2Te28jjW81yu";

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playMcSound(type) {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'xp') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'mine') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, audioCtx.currentTime);
          osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.15);
        } else if (type === 'break') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(100, audioCtx.currentTime);
          osc.frequency.linearRampToValueAtTime(30, audioCtx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'levelup') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, audioCtx.currentTime);
          osc.frequency.setValueAtTime(554.37, audioCtx.currentTime + 0.1);
          osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.2);
          osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.5);
        }
      } catch(e) {}
    }

    let gameState = {
      level: 1,
      xp: 0,
      maxXp: 100,
      streak: 0,
      hasDebuff: false,
      debuffEndTime: 0
    };

    async function loadStateFromCloud() {
      if (BIN_ID === "ВАШ_BIN_ID_ЗДЕСЬ") {
        document.getElementById('sync-status').style.backgroundColor = '#ff5555';
        return;
      }
      try {
        const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          headers: { 'X-Master-Key': API_KEY }
        });
        const data = await response.json();
        if (data && data.record) {
          gameState = data.record;
          updateUI();
          document.getElementById('sync-status').style.backgroundColor = '#55ff55';
        }
      } catch(e) {
        document.getElementById('sync-status').style.backgroundColor = '#ff5555';
      }
    }

    async function saveStateToCloud() {
      if (BIN_ID === "ВАШ_BIN_ID_ЗДЕСЬ") return;
      document.getElementById('sync-status').style.backgroundColor = '#ffff55';
      try {
        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': API_KEY
          },
          body: JSON.stringify(gameState)
        });
        document.getElementById('sync-status').style.backgroundColor = '#55ff55';
      } catch(e) {
        document.getElementById('sync-status').style.backgroundColor = '#ff5555';
      }
    }

    function checkDebuff() {
      if (gameState.hasDebuff && Date.now() > gameState.debuffEndTime) {
        gameState.hasDebuff = false;
      }
    }

    // АНИМАЦИЯ ПОШАГОВОГО РАЗРУШЕНИЯ БЛОКА КИРКОЙ
    const crackPaths = [
      "M 10 20 L 30 40 L 25 60 M 50 10 L 45 35 L 70 50",
      "M 10 20 L 30 40 L 25 60 L 10 80 M 50 10 L 45 35 L 70 50 L 85 80 M 30 40 L 60 40",
      "M 0 10 L 30 40 L 25 60 L 10 100 M 50 0 L 45 35 L 70 50 L 100 90 M 30 40 L 80 30 M 25 60 L 60 70",
      "M 0 0 L 30 40 L 25 60 L 0 100 M 50 0 L 45 35 L 70 50 L 100 100 M 0 50 L 100 50 M 30 40 L 100 0 M 25 60 L 80 100"
    ];

    function triggerMinecraftBlockBreak() {
      const overlay = document.getElementById('animation-overlay');
      const pickaxe = document.getElementById('diamond-pickaxe');
      const mainGui = document.getElementById('main-gui');
      const crackOverlay = document.getElementById('crack-overlay');
      const crackPath = document.getElementById('crack-path');
      const banner = document.getElementById('levelup-banner');

      overlay.classList.remove('hidden');
      crackOverlay.classList.remove('hidden');
      banner.classList.add('hidden');
      pickaxe.classList.add('animate-mining');
      mainGui.classList.add('animate-shake');

      let stage = 0;
      const mineInterval = setInterval(() => {
        if (stage < crackPaths.length) {
          crackPath.setAttribute('d', crackPaths[stage]);
          playMcSound('mine');
          spawnBlockParticles();
          stage++;
        } else {
          clearInterval(mineInterval);
          
          // ФИНАЛЬНЫЙ РАЗЛОМ БЛОКА
          playMcSound('break');
          pickaxe.classList.remove('animate-mining');
          mainGui.classList.remove('animate-shake');
          mainGui.classList.add('animate-shatter');
          crackOverlay.classList.add('hidden');

          setTimeout(() => {
            // Вылет баннера Level-Up
            document.getElementById('banner-level-num').innerText = gameState.level;
            banner.classList.remove('hidden');
            playMcSound('levelup');

            setTimeout(() => {
              mainGui.classList.remove('animate-shatter');
              overlay.classList.add('hidden');
              crackPath.setAttribute('d', '');
            }, 1600);

          }, 300);
        }
      }, 250);
    }

    function spawnBlockParticles() {
      const guiRect = document.getElementById('main-gui').getBoundingClientRect();
      for (let i = 0; i < 8; i++) {
        const p = document.createElement('div');
        p.className = 'mc-particle';
        p.style.left = (guiRect.left + Math.random() * guiRect.width) + 'px';
        p.style.top = (guiRect.top + Math.random() * guiRect.height) + 'px';
        document.body.appendChild(p);

        const vx = (Math.random() - 0.5) * 150;
        const vy = (Math.random() - 0.5) * 150;

        p.animate([
          { transform: 'translate(0, 0)', opacity: 1 },
          { transform: `translate(${vx}px, ${vy}px)`, opacity: 0 }
        ], { duration: 400, easing: 'ease-out' }).onfinish = () => p.remove();
      }
    }

    function addXP(amount) {
      checkDebuff();
      let finalXP = gameState.hasDebuff ? Math.floor(amount * 0.5) : amount;
      gameState.xp += finalXP;
      
      playMcSound('xp');

      if (gameState.xp >= gameState.maxXp) {
        gameState.xp -= gameState.maxXp;
        gameState.level += 1;
        gameState.maxXp = Math.floor(gameState.maxXp * 1.3);
        
        // Запуск ломания блока киркой
        triggerMinecraftBlockBreak();
      }
      saveStateToCloud();
      updateUI();
    }

    function triggerMacro(type) {
      addXP(20);
    }

    function toggleQuest(checkbox, xpAmount) {
      if (checkbox.checked) {
        addXP(xpAmount);
      } else {
        gameState.xp = Math.max(0, gameState.xp - xpAmount);
        saveStateToCloud();
        updateUI();
      }
    }

    function addCleanDay() {
      gameState.streak += 1;
      playMcSound('xp');
      saveStateToCloud();
      updateUI();
    }

    function triggerRelapse() {
      if (confirm("Зафиксировать срыв? Стрик будет сброшен, и активируется дебафф 'Выгорание рецепторов' (-50% XP) на 24 часа.")) {
        gameState.streak = 0;
        gameState.hasDebuff = true;
        gameState.debuffEndTime = Date.now() + (24 * 60 * 60 * 1000);
        playMcSound('break');
        saveStateToCloud();
        updateUI();
      }
    }

    function updateUI() {
      checkDebuff();
      document.getElementById('player-level').innerText = gameState.level;
      document.getElementById('streak-days').innerText = gameState.streak;
      document.getElementById('current-xp').innerText = gameState.xp;
      document.getElementById('max-xp').innerText = gameState.maxXp;
      
      const xpPercent = Math.min(100, Math.floor((gameState.xp / gameState.maxXp) * 100));
      document.getElementById('xp-bar').style.width = `${xpPercent}%`;

      const debuffBanner = document.getElementById('debuff-banner');
      if (gameState.hasDebuff) {
        debuffBanner.classList.remove('hidden');
      } else {
        debuffBanner.classList.add('hidden');
      }
    }

    loadStateFromCloud();
  </script>
</body>
</html>
